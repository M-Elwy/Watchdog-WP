name: Deploy To WP Server PRD
on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: false

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy PRD
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 'main'

      - name: rsync files via ssh
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: --cvs-exclude --progress -rvz --exclude='.*' --exclude='TO-DO.txt' --exclude='tests/' --exclude='tools/' --exclude='phpunit.xml.dist'
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USERNAME }}
          remote_key: ${{ secrets.PRIVATE_KEY }}
          remote_port: ${{ secrets.PORT }}
          path: .
          remote_path: ${{ secrets.TARGET_PATH }}
